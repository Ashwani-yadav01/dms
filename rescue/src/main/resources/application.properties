spring.application.name=rescue
server.port=8083
# ==========================================
# Database Configuration (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/rescue_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Redis Spatial Cache Configuration
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# ==========================================
# Apache Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# Consumer Configuration
spring.kafka.consumer.group-id=rescue-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Modern ErrorHandlingDeserializer Delegate Settings
spring.kafka.consumer.properties.spring.json.value.default.type=com.dms.common.events.IncidentCreatedEvent
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Package Trust Strategy for JSON Deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dms.*

# ==========================================
# Custom Topic Properties
# ==========================================
application.kafka.topic.incident-created=incident-created-topic
app.kafka.topics.rescue-mission-status=rescue-mission-status-topic

# ==========================================
# SWAGGER / OPENAPI SPEC CONFIGURATION
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==========================================
# RESILIENCE4J CIRCUIT BREAKER CONFIG
# ==========================================
# Number of calls evaluated in the sliding window
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
# Minimum calls before failure rate evaluation begins
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=5
# Failure rate percentage to trip the breaker (50%)
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
# Time to stay in OPEN state before trying HALF-OPEN
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s
# Permitted test calls in HALF-OPEN state
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
# Track slow calls (latency > 2s trips the breaker)
resilience4j.circuitbreaker.instances.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.default.slow-call-rate-threshold=50

# Actuator exposure for health monitoring
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true