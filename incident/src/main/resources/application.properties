spring.application.name=incident
server.port=8082

# Incident PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/incident_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Must match the secret key in user-service exactly!
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970


# ==========================================
# Apache Kafka Producer Configuration
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092

# Serializers for Key (String) and Value (JSON)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Custom Topic Property
application.kafka.topic.incident-created=incident-created-topic
