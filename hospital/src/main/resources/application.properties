
# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8084
spring.application.name=hospital-service

# ===============================
# POSTGRESQL DATABASE CONFIGURATION
# ===============================
# Update the URL, username, and password to match your local Postgres setup
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
# Use 'update' for development. In production, this is usually 'validate' or 'none' (using Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# REDIS CONFIGURATION (For Spatial / GEO Data)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Producer Settings (For sending Inventory Shortage Alerts)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer Settings (For receiving incoming casualties)
spring.kafka.consumer.group-id=hospital-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
