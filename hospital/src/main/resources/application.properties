# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=8084
spring.application.name=hospital-service


# ===============================
# POSTGRESQL DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# REDIS CONFIGURATION
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379


# ===============================
# KAFKA CONFIGURATION
# ===============================
spring.kafka.bootstrap-servers=localhost:9092


# ===============================
# KAFKA PRODUCER
# ===============================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Do not send Java class information in Kafka headers
spring.kafka.producer.properties.spring.json.add.type.headers=false


# ===============================
# KAFKA CONSUMER
# ===============================
spring.kafka.consumer.group-id=hospital-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ErrorHandlingDeserializer wraps the actual JsonDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Hospital's local Kafka event package
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dms.hospitalService.hospital.kafka.event

# Do not try to determine the Java class from Kafka headers
spring.kafka.consumer.properties.spring.json.use.type.headers=false


# ===============================
# KAFKA TOPICS
# ===============================
application.kafka.topic.incident-created=incident-created-topic
application.kafka.topic.hospital-standby=hospital-standby-topic
application.kafka.topic.supply-dispatched=supply-dispatched-topic


# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


# ==========================================
# RESILIENCE4J CIRCUIT BREAKER
# ==========================================
resilience4j.circuitbreaker.instances.default.sliding-window-size=10
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.default.slow-call-rate-threshold=50


# ===============================
# ACTUATOR / HEALTH
# ===============================
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true


# ===============================
# MANAGEMENT & ACTUATOR EXPOSURE
# ===============================
management.endpoints.web.exposure.include=health,info,gateway,prometheus,metrics,circuitbreakers
management.endpoint.prometheus.enabled=true


# ===============================
# MICROMETER TRACING & ZIPKIN
# ===============================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans