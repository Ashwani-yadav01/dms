# ===============================
# SERVER & APP CONFIGURATION
# ===============================
server.port=8080
spring.application.name=api-gateway

# ===============================
# GLOBAL CORS CONFIGURATION
# ===============================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# ===============================
# GATEWAY ROUTES
# ===============================

# 1. User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**, /api/v1/auth/**

# 2. Incident Service
spring.cloud.gateway.routes[1].id=incident-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/incidents/**

# 3. Hospital Service
spring.cloud.gateway.routes[2].id=hospital-service
spring.cloud.gateway.routes[2].uri=http://localhost:8084
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/hospitals/**, /api/v1/admissions/**

# 4. Logistics Service
spring.cloud.gateway.routes[3].id=logistics-service
spring.cloud.gateway.routes[3].uri=http://localhost:8085
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/logistics/**

# 5. Notification Service
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/notifications/**

# ===============================
# ACTUATOR & MONITORING
# ===============================
management.endpoints.web.exposure.include=health,info,gateway